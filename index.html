<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruin Woods Lottery</title>
  <link rel="stylesheet" href="assets/tailwind.css" />
  <style>
    :root {
      --ink: #102a43;
      --muted: #627d98;
      --line: #d9e2ec;
      --paper: #f6f8fb;
      --surface: #ffffff;
      --navy: #003b5c;
      --blue: #2774ae;
      --gold: #ffd100;
      --pine: #176b4d;
      --pine-dark: #0e4f39;
      --sky: #eaf4fb;
    }

    html { font-size: 15px; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 94% 4%, rgba(39, 116, 174, .09), transparent 28rem),
        radial-gradient(circle at 6% 20%, rgba(255, 209, 0, .10), transparent 24rem),
        var(--paper);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    .grain { display: none; }
    .app-header { box-shadow: 0 1px 0 rgba(16, 42, 67, .09); }
    .app-nav-btn { color: #486581; transition: .15s ease; }
    .app-nav-btn:hover, .app-nav-btn.active { color: var(--navy); background: #edf4f8; }
    .app-nav-btn.active { font-weight: 800; }
    .workspace-shell { min-width: 0; }
    .tab-panel { min-width: 0; }
    .surface-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1.1rem;
      box-shadow: 0 1px 2px rgba(16, 42, 67, .04);
    }
    .home-hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(115deg, #ffffff 0%, #f8fbfd 62%, #eef7fb 100%);
      border: 1px solid #c8d9e5;
      box-shadow: 0 10px 26px rgba(16, 42, 67, .07);
    }
    .home-hero::before {
      content: "";
      position: absolute;
      width: 21rem;
      height: 21rem;
      right: -8rem;
      top: -13rem;
      border: 1px solid rgba(39, 116, 174, .14);
      border-radius: 999px;
      box-shadow: 0 0 0 2.75rem rgba(39, 116, 174, .045), 0 0 0 5.5rem rgba(39, 116, 174, .028);
      pointer-events: none;
    }
    .home-hero::after {
      content: "";
      position: absolute;
      inset: auto 2rem 1.3rem 2rem;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), rgba(255, 209, 0, 0));
      pointer-events: none;
    }
    .home-hero > * { position: relative; z-index: 1; }
    .home-action-grid { display: grid; gap: 1rem; }
    @media (min-width: 780px) {
      .home-action-grid { grid-template-columns: 1.25fr repeat(3, minmax(0, 1fr)); }
      .home-action-grid .action-card { min-height: 14.5rem; }
    }
    .action-card {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 1.1rem;
      padding: 1.45rem;
      text-align: left;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .action-card:hover { transform: translateY(-3px); border-color: #9fb3c8; box-shadow: 0 12px 28px rgba(16, 42, 67, .11); }
    .action-card-primary { border-color: #003b5c; background: linear-gradient(145deg, #004a72, #003b5c); color: white; }
    .action-card-primary:hover { border-color: #003b5c; box-shadow: 0 14px 30px rgba(0, 59, 92, .24); }
    .action-icon { display: grid; place-items: center; width: 2.8rem; height: 2.8rem; border-radius: .85rem; background: #edf4f8; color: var(--navy); font-size: 1.35rem; }
    .action-card-primary .action-icon { background: rgba(255,255,255,.16); color: var(--gold); }
    .status-dot { width: .55rem; height: .55rem; border-radius: 999px; background: #2f855a; display: inline-block; }
    .action-card:focus-visible, .app-nav-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(255, 209, 0, .78); outline-offset: 3px; }
    .action-card p, .action-card span { text-wrap: balance; }
    .staff-stat { border: 1px solid var(--line); background: var(--surface); border-radius: .9rem; padding: .9rem 1rem; }
    .staff-stat-label { display: block; font-size: .69rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #627d98; }
    .staff-stat-value { display: block; margin-top: .2rem; font-size: 1.2rem; font-weight: 800; color: #102a43; line-height: 1.15; }
    .staff-table-wrap { max-height: min(68vh, 980px); overflow: auto; }
    .staff-table-wrap thead { position: sticky; top: 0; z-index: 1; }
    .fade-in { animation: riseIn .28s ease-out both; }
    .staff-dense { font-size: .9rem; line-height: 1.45; }
    .breadcrumb-current { color: var(--muted); }
    .history-row { transition: background .15s ease; }
    .history-row:hover { background: #f7fafc; }
    .fairness-panel h3 { margin: 0; color: #102a43; }
    .fairness-note { margin-top: .35rem; color: #486581; font-size: .86rem; }
    .histogram-shell {
      margin-top: .9rem;
      border: 1px solid #d9e2ec;
      border-radius: .85rem;
      padding: .8rem;
      background: #fbfdff;
    }
    .histogram-legend {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem;
      align-items: center;
      margin-bottom: .65rem;
      color: #486581;
      font-size: .78rem;
      font-weight: 700;
    }
    .legend-item { display: inline-flex; align-items: center; gap: .35rem; }
    .legend-chip {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }
    .legend-chip.actual { background: #d05f2d; }
    .legend-chip.linear { background: #7b8ba1; }
    .legend-chip.fishbowl { background: #003b5c; }
    .hist-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: .5rem;
      align-items: start;
      margin: .5rem 0;
    }
    .hist-label {
      font-size: .76rem;
      font-weight: 800;
      color: #102a43;
      padding-top: .15rem;
    }
    .hist-bars { display: grid; gap: .35rem; }
    .hist-series {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) max-content;
      align-items: center;
      gap: .55rem;
    }
    .hist-track {
      height: 14px;
      border-radius: 999px;
      background: #e8eef5;
      overflow: hidden;
      position: relative;
    }
    .hist-fill { height: 100%; min-width: 2px; }
    .hist-fill.actual { background: #d05f2d; }
    .hist-fill.linear { background: #7b8ba1; }
    .hist-fill.fishbowl { background: #003b5c; }
    .hist-value {
      font-size: .73rem;
      font-weight: 700;
      color: #334e68;
      white-space: nowrap;
    }
    .tour-highlight { position: relative; z-index: 61; box-shadow: 0 0 0 5px rgba(255, 209, 0, .75), 0 0 0 9999px rgba(16, 42, 67, .58); border-radius: .7rem; }
    .tour-popover { position: fixed; z-index: 62; width: min(360px, calc(100vw - 2rem)); box-shadow: 0 24px 60px rgba(16, 42, 67, .34); }
    @keyframes riseIn { from { transform: translateY(7px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    @media print {
      @page { size: landscape; margin: 0.5cm; }

      /* Hide everything except the poster tab */
      .grain, #networkBanner, #syncingOverlay, .app-header, #sidePanel,
      #entryModal, #editFamilyModal, #confirmationModal, #tourOverlay,
      #tab-home, #tab-history, #tab-config, #tab-entry, #tab-results, #tab-wiki { display: none !important; }

      body { background: white !important; }
      main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
      #appLayout { display: block !important; }
      #staffView { display: block !important; max-width: 100% !important; margin: 0 !important; }
      .staff-dashboard-shell {
        max-height: none !important;
        overflow: visible !important;
        box-shadow: none !important;
        border: none !important;
        background: white !important;
        padding: 0 !important;
        border-radius: 0 !important;
      }
      #tab-poster { display: block !important; }

      /* Hide poster controls bar and waitlist */
      #posterModeRoot > div:first-child,
      #posterEmailPrompt,
      #posterWaitlistSection { display: none !important; }

      /* One activity per page, day/time cards horizontal within each page */
      #posterAssignments { display: block !important; }

      .activity-page {
        break-after: page !important;
        page-break-after: always !important;
      }

      .activity-page:last-child {
        break-after: avoid !important;
        page-break-after: avoid !important;
      }

      .activity-page h3 {
        font-size: 1.2rem !important;
        margin-bottom: 0.3rem !important;
        padding-bottom: 0.2rem !important;
      }

      .day-cards {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        align-items: flex-start !important;
        gap: 0.35rem !important;
        width: 100% !important;
      }

      .day-cards section {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        font-size: 0.72rem !important;
        padding: 0.4rem 0.5rem !important;
        border-radius: 0.5rem !important;
      }

      .day-cards section p  { font-size: 0.65rem !important; margin-bottom: 0.2rem !important; }
      .day-cards section li { font-size: 0.68rem !important; padding: 0.2rem 0 !important; }
    }
  </style>
</head>

  <script>
    /* ── Tab Switching ─────────────────────────────────────────────────────────
       Self-contained, non-module script so tabs work even if the ES-module
       block fails to load (e.g. file:// CORS restrictions).
       Uses a single delegated listener instead of N individual ones.
    ──────────────────────────────────────────────────────────────────────── */
    (function () {
      var TAB_NAMES = ["home", "history", "config", "entry", "results", "poster", "forms", "wiki"];
      var TAB_LABELS = {
        home: "Home",
        history: "Past lotteries",
        config: "Master settings",
        entry: "Lottery workspace",
        results: "Lottery review",
        poster: "Poster view",
        forms: "Lottery forms",
        wiki: "Wiki & tutorial"
      };

      function switchToTab(tabName) {
        if (!TAB_NAMES.includes(tabName)) return;
        var rendererName = { poster: "renderPosterTab", forms: "renderFormsTab", wiki: "renderWikiTab", history: "renderHistoryTab" }[tabName];
        if (rendererName && typeof window[rendererName] === "function") {
          try {
            window[rendererName]();
          } catch (error) {
            console.error("Unable to refresh view", tabName, error);
          }
        }
        TAB_NAMES.forEach(function (name) {
          var panel = document.getElementById("tab-" + name);
          if (panel) panel.classList.toggle("hidden", name !== tabName);
        });
        document.querySelectorAll(".staff-tab-btn[data-tab]").forEach(function (btn) {
          btn.classList.toggle("active", btn.dataset.tab === tabName);
        });
        var breadcrumb = document.getElementById("breadcrumbCurrent");
        if (breadcrumb) breadcrumb.textContent = TAB_LABELS[tabName] || tabName;
      }

      // Single delegated listener covers all current and future tab buttons.
      document.addEventListener("click", function (e) {
        var btn = e.target.closest(".staff-tab-btn[data-tab]");
        if (btn) switchToTab(btn.dataset.tab);
      });

      // Expose for programmatic use by the module.
      window.switchToTab = switchToTab;

      // Delegated handler for "Go to issue" buttons in pre-run validation.
      document.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-goto-issue]");
        if (!btn) return;
        switchToTab("entry");
        var room = btn.dataset.gotoIssue;
        var searchInput = document.getElementById("entrySearch");
        if (searchInput && room) {
          searchInput.value = room;
          searchInput.dispatchEvent(new Event("input"));
          setTimeout(function () {
            var firstRow = document.querySelector("tr[data-family-row]:not(.hidden)");
            if (firstRow) {
              firstRow.scrollIntoView({ behavior: "smooth", block: "center" });
              firstRow.focus();
            }
          }, 50);
        }
      });
    })();
  </script>

  <script>
    /* ── Inlined module code (no ES-module imports — works on file:// in all browsers) ── */

    function validatePreRunStateHelper(context) {
      const {
        state, CHOICE_KEYS, CHOICE_RANGES, dayOrder,
        getAllSlots, getActivities, roomNorm, findFamilyByRoom
      } = context;
      const issues = [], warnings = [];
      const families = state.families || [];
      const byRoom = new Map();
      const allSlots = getAllSlots();
      const slotById = new Map(allSlots.map(slot => [slot.id, slot]));
      const activitiesById = new Map(getActivities().map(activity => [activity.id, activity]));
      const addIssue = (msg) => issues.push(msg);
      const addWarning = (msg) => warnings.push(msg);
      if ((Number(state.config.expectedFamilies) || 0) < families.length)
        addIssue(`Expected families (${state.config.expectedFamilies}) is lower than checked in families (${families.length}).`);
      if ((Number(state.config.maxWinsPerFamily) || 0) < 1)
        addIssue("Max wins per family must be at least 1.");
      allSlots.forEach(slot => {
        const cap = Number(slot.capacity);
        if (!Number.isFinite(cap) || cap < 0)
          addIssue(`Slot ${slot.label} has invalid capacity (${slot.capacity}).`);
      });
      const seenLotteryNumbers = { choice1: new Map(), choice2: new Map(), choice3: new Map(), choice4: new Map() };
      families.forEach(family => {
        const room = roomNorm(family.roomNumber);
        if (!room) addIssue(`${family.lastName || "Unknown family"} is missing a room number.`);
        else if (byRoom.has(room)) addIssue(`Duplicate room number ${family.roomNumber} for ${byRoom.get(room).lastName} and ${family.lastName}.`);
        else byRoom.set(room, family);
        CHOICE_KEYS.forEach((choiceKey, idx) => {
          const number = family.lotteryNumbers?.[choiceKey];
          if (!Number.isFinite(number)) { addIssue(`${family.lastName} (Room ${family.roomNumber}) is missing ${choiceKey} lottery number.`); return; }
          const range = CHOICE_RANGES[choiceKey];
          if (number < range.min || number > range.max)
            addIssue(`${family.lastName} (Room ${family.roomNumber}) has ${choiceKey} number ${number} outside ${range.min}-${range.max}.`);
          const keyMap = seenLotteryNumbers[choiceKey];

    function runSerpentineLotteryHelper(context) {
      const { state, getAllSlots, getValidPairMapForChoice, buildPassGroups, getActivityById, getSlotById, hasConflict, getSharedPairSlotIds, sortSlotsByDayAndTime, buildResultRow, parseRoomNumber } = context;

      function allocateSingle(family, passDef, forcedNumber = null, forcedReasonPrefix = "", winCap = maxWins) {

        const choice = family.form?.choices?.[passDef.choiceIndex];
        if (!choice?.activityId) return;

        if (!activity) return;
        const slotIds = choice.slots.filter(Boolean);
        let booked = false;
        for (const slotId of slotIds) {
          const slot = getSlotById(slotId);
          if (!slot || slot.activityId !== activity.id) continue;
          if ((capacityBySlot[slot.id] || 0) <= 0) continue;
          if (hasConflict(allocationsByFamily[family.id], slot)) continue;
          if ((choice.excludedDays || []).includes(slot.day)) continue;
          capacityBySlot[slot.id] -= 1; winsByFamily[family.id] += 1;
          const row = buildResultRow({ runAt, status: "allocated", familyId: family.id, lastName: family.lastName, roomNumber: family.roomNumber, activityId: activity.id, activityName: activity.name, slotId: slot.id, slotLabel: slot.label, pass: passDef.pass, choiceNumber: passDef.choiceIndex + 1, lotteryNumber: forcedNumber ?? family.lotteryNumbers?.[passDef.choiceKey] ?? null, reason: forcedReasonPrefix ? `${forcedReasonPrefix}Soft-link fallback success` : "" });

            if (hasConflict(allocationsByFamily[familyB.id], slot)) continue;

            const rowA = buildResultRow({ runAt, status: "allocated", familyId: familyA.id, lastName: familyA.lastName, roomNumber: familyA.roomNumber, activityId: activity.id, activityName: activity.name, slotId: slot.id, slotLabel: slot.label, pass: passDef.pass, choiceNumber: passDef.choiceIndex + 1, lotteryNumber: group.effectiveNumber, pairedWithFamilyId: familyB.id });

      });
      return { rows, runAt };
    }

      }, null);

      document.querySelectorAll("input[data-slot-capacity]").forEach(input => {

        const cap = Math.max(0, parseInt(input.value, 10) || 0);
        nextActivities.forEach(activity => {

          });
        });
      });

      return {
        expectedFamilies,
        maxWinsPerFamily,
        activities: nextActivities
      };
    }

    function slugifySlotToken(value) {
      const normalized = String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      return normalized || "slot";
    }

    function buildManualSlot(activityId, day, time, capacity, customLabel = "") {
      const baseId = `${slugifySlotToken(activityId)}-${slugifySlotToken(day)}-${slugifySlotToken(time)}`;
      let slotId = baseId;
      const existingSlotIds = new Set(getAllSlots().map(slot => slot.id));
      let suffix = 2;
      while (existingSlotIds.has(slotId)) {
        slotId = `${baseId}-${suffix}`;
        suffix += 1;
      }

      return {
        id: slotId,
        label: customLabel.trim() || `${day} ${time}`,
        day,
        time,
        capacity
      };
    }

    function isSlotInUse(slotId) {

      const isAssignedInResults = state.results.rows.some(row => row.slotId === slotId);
      return isChosenOnForm || isAssignedInResults;
    }

    function normalizeChoices(choices) {
      const base = defaultFamilyForm().choices;
      if (!Array.isArray(choices)) return base;
      return base.map((row, i) => {
        const inc = choices[i] || {};
        const slots = Array.isArray(inc.slots) ? inc.slots.slice(0, 3) : ["", "", ""];
        while (slots.length < 3) slots.push("");
        const excludedDays = Array.isArray(inc.excludedDays) ? inc.excludedDays.filter(d => dayOrder.includes(d)) : [];
        const skiingTypes = Array.isArray(inc.skiingTypes)

          : [];
        return {
          activityId: inc.activityId || "",
          slots,
          excludedDays,
          pairRoomNumber: String(inc.pairRoomNumber || ""),
          anyAvailable: Boolean(inc.anyAvailable),
          skiingTypes
        };
      });
    }

    function normalizeFamilies(families) {
      if (!Array.isArray(families)) return [];
      return families.map(f => {
        const normalizedChoices = normalizeChoices(f.form?.choices);
        const expectedPartySize = Number.isFinite(Number(f.expectedPartySize)) && Number(f.expectedPartySize) > 0
          ? Math.floor(Number(f.expectedPartySize))
          : null;
        if (!normalizedChoices.some(choice => choice.anyAvailable) && Boolean(f.form?.anyAvailable)) {
          normalizedChoices.forEach(choice => {

          });
        }

        return {
          id: String(f.id || ""),
          lastName: String(f.lastName || ""),
          roomNumber: String(f.roomNumber || ""),
          checkedInAt: String(f.checkedInAt || new Date().toISOString()),
          expectedPartySize,
          lotteryNumbers: {
            choice1: Number.isFinite(f.lotteryNumbers?.choice1) ? f.lotteryNumbers.choice1 : null,
            choice2: Number.isFinite(f.lotteryNumbers?.choice2) ? f.lotteryNumbers.choice2 : null,
            choice3: Number.isFinite(f.lotteryNumbers?.choice3) ? f.lotteryNumbers.choice3 : null,
            choice4: Number.isFinite(f.lotteryNumbers?.choice4) ? f.lotteryNumbers.choice4 : null
          },
          form: {
            ...defaultFamilyForm(),
            ...(f.form || {}),
            choices: normalizedChoices,
            anyAvailable: normalizedChoices.some(choice => choice.anyAvailable)
          }
        };
      }).filter(f => f.id);
    }

    function getActivities() {
      return Array.isArray(state.config.activities) && state.config.activities.length ? state.config.activities : defaultActivities();
    }

    function getAllSlots() {
      return getActivities().flatMap(activity => activity.slots.map(slot => ({ ...slot, activityId: activity.id, activityName: activity.name })));
    }

    function getActivityById(activityId) {
      return getActivities().find(a => a.id === activityId);
    }

    function getSlotById(slotId) {
      return getAllSlots().find(s => s.id === slotId);
    }

    function parseRoomNumber(room) {
      const n = parseInt(String(room || "").replace(/[^0-9]/g, ""), 10);
      return Number.isFinite(n) ? n : Number.MAX_SAFE_INTEGER;
    }

    function roomNorm(room) {
      return String(room || "").trim().toLowerCase();
    }

    function findFamilyByRoom(roomNumber) {
      const target = roomNorm(roomNumber);
      if (!target) return null;
      return state.families.find(f => roomNorm(f.roomNumber) === target) || null;
    }

    function timeKey(slot) {
      return `${slot.day}|${slot.time}`;
    }

    function parseTimeToMinutes(label) {
      const match = String(label || "").trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
      if (!match) return Number.MAX_SAFE_INTEGER;
      let hour = parseInt(match[1], 10);
      const minute = parseInt(match[2], 10);
      const meridiem = match[3].toUpperCase();
      if (meridiem === "PM" && hour !== 12) hour += 12;
      if (meridiem === "AM" && hour === 12) hour = 0;
      return hour * 60 + minute;
    }

    function sortSlotsByDayAndTime(a, b) {
      const dayDiff = dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day);
      if (dayDiff !== 0) return dayDiff;
      const timeDiff = parseTimeToMinutes(a.time) - parseTimeToMinutes(b.time);
      if (timeDiff !== 0) return timeDiff;
      return String(a.label || "").localeCompare(String(b.label || ""));
    }

    function hasConflict(existingAllocations, slot) {
      const next = timeKey(slot);
      return existingAllocations.some(a => {
        const existingSlot = getSlotById(a.slotId);
        return existingSlot && timeKey(existingSlot) === next;
      });
    }

    function updatePairingForChoice(familyId, choiceIndex, pairRoomNumber) {
      const family = state.families.find(f => f.id === familyId);
      if (!family) return { ok: false, message: "Family not found." };

      const requested = String(pairRoomNumber || "").trim();
      const currentPair = family.form.choices?.[choiceIndex]?.pairRoomNumber || "";

      if (!requested) {
        if (family.form.choices[choiceIndex]) family.form.choices[choiceIndex].pairRoomNumber = "";
        const buddy = findFamilyByRoom(currentPair);
        if (buddy && roomNorm(buddy.form.choices?.[choiceIndex]?.pairRoomNumber) === roomNorm(family.roomNumber)) {
          if (buddy.form.choices[choiceIndex]) buddy.form.choices[choiceIndex].pairRoomNumber = "";
        }
        return { ok: true };
      }

      const target = findFamilyByRoom(requested);
      if (!target) return { ok: false, message: `Choice ${choiceIndex + 1}: Pair room must match an existing checked-in room.` };
      if (target.id === family.id) return { ok: false, message: "Cannot pair with own room number." };

      const oldBuddy = findFamilyByRoom(currentPair);
      if (oldBuddy && roomNorm(oldBuddy.form.choices?.[choiceIndex]?.pairRoomNumber) === roomNorm(family.roomNumber)) {
        if (oldBuddy.form.choices[choiceIndex]) oldBuddy.form.choices[choiceIndex].pairRoomNumber = "";
      }

      const targetCurrentPair = target.form.choices?.[choiceIndex]?.pairRoomNumber || "";
      const targetOldBuddy = findFamilyByRoom(targetCurrentPair);
      if (targetOldBuddy && targetOldBuddy.id !== family.id && roomNorm(targetOldBuddy.form.choices?.[choiceIndex]?.pairRoomNumber) === roomNorm(target.roomNumber)) {
        if (targetOldBuddy.form.choices[choiceIndex]) targetOldBuddy.form.choices[choiceIndex].pairRoomNumber = "";
      }

      if (family.form.choices[choiceIndex]) family.form.choices[choiceIndex].pairRoomNumber = target.roomNumber;
      if (target.form.choices[choiceIndex]) target.form.choices[choiceIndex].pairRoomNumber = family.roomNumber;

      return { ok: true };
    }

    function getAssignedNumberSetFor(choiceKey) {
      return new Set(state.families.map(f => f.lotteryNumbers?.[choiceKey]).filter(Number.isFinite));
    }

    function drawUniqueLotteryNumberFor(choiceKey) {
      const range = CHOICE_RANGES[choiceKey];
      const assigned = getAssignedNumberSetFor(choiceKey);
      const available = [];
      for (let i = range.min; i <= range.max; i += 1) {
        if (!assigned.has(i)) available.push(i);
      }
      if (!available.length) return null;
      return available[Math.floor(Math.random() * available.length)];
    }

    function drawUniqueLotterySet() {
      const out = {};
      for (const key of CHOICE_KEYS) {
        const num = drawUniqueLotteryNumberFor(key);
        if (num === null) return null;
        out[key] = num;
      }
      return out;
    }

    function summarizeFamilyForm(form) {
      const lines = [];
      form.choices.forEach((choice, idx) => {
        if (!choice.activityId) return;
        const activity = getActivityById(choice.activityId);
        const slotLabels = choice.slots.map(s => getSlotById(s)?.label).filter(Boolean);
        const extras = [];
        if (choice.excludedDays?.length) extras.push(`excl: ${choice.excludedDays.join(",")}`);
        if (choice.pairRoomNumber?.trim()) extras.push(`pair: Rm ${choice.pairRoomNumber.trim()}`);
        if (choice.anyAvailable) extras.push("open to any slot");
        if (choice.activityId === "waterskiing" && choice.skiingTypes?.length) {
          const labels = choice.skiingTypes.map(type => WATERSKIING_TYPE_OPTIONS.find(option => option.id === type)?.label || type);
          extras.push(`types: ${labels.join(", ")}`);
        }
        const extrasStr = extras.length ? ` [${extras.join("; ")}]` : "";
        lines.push(`C${idx + 1}: ${activity?.name || "Unknown"}${slotLabels.length ? ` (${slotLabels.join(" / ")})` : ""}${extrasStr}`);
      });
      return lines.length ? lines.join(" | ") : "No form entered yet";
    }

    function formatWaterskiingTypesForRow(row) {
      if (!row || (row.activityId !== "waterskiing" && row.activityName !== "Waterskiing")) return "";
      const family = state.families.find(f => f.id === row.familyId);
      const choices = Array.isArray(family?.form?.choices) ? family.form.choices : [];

      let matchedChoice = null;
      if (row.slotId) {
        matchedChoice = choices.find(choice =>
          choice.activityId === "waterskiing"
          && Array.isArray(choice.slots)
          && choice.slots.includes(row.slotId)
        );
      }

      if (!matchedChoice && Number.isFinite(row.choiceNumber) && row.choiceNumber >= 1) {
        const byChoiceNumber = choices[row.choiceNumber - 1];
        if (byChoiceNumber?.activityId === "waterskiing") matchedChoice = byChoiceNumber;
      }

      if (!matchedChoice) {
        matchedChoice = choices.find(choice =>
          choice.activityId === "waterskiing"
          && Array.isArray(choice.skiingTypes)
          && choice.skiingTypes.length
        );
      }

      const selectedTypes = Array.isArray(matchedChoice?.skiingTypes)
        ? matchedChoice.skiingTypes
        : [];
      if (!selectedTypes.length) return "";

      const labels = selectedTypes
        .map(typeId => WATERSKIING_TYPE_OPTIONS.find(option => option.id === typeId)?.label || typeId)
        .filter(Boolean);
      return labels.length ? ` (${labels.join(", ")})` : "";

    function formatExpectedPartySizeForRow(row) {
      if (!row) return "";
      const family = state.families.find(f => f.id === row.familyId);
      const partySize = Number(family?.expectedPartySize);
      if (!Number.isFinite(partySize) || partySize < 1) return "";
      const count = Math.floor(partySize);
      return ` (${count} ${count === 1 ? "person" : "people"})`;

    function buildChoiceEditor(choice, idx, allChoices) {
      const takenActivities = new Set(allChoices.map((c, i) => i !== idx ? c.activityId : null).filter(Boolean));

      const activityOptions = getActivities()
        .filter(a => a.id === choice.activityId || !takenActivities.has(a.id))
        .map(a => `<option value="${a.id}" ${choice.activityId === a.id ? "selected" : ""}>${a.name}</option>`)
        .join("");

      const activity = getActivityById(choice.activityId);
      const slots = activity ? activity.slots : [];
      const sortedSlots = slots.slice().sort(sortSlotsByDayAndTime);

      const slotDropdowns = [0, 1, 2].map(slotIdx => {
        const selectedElsewhere = new Set(choice.slots.map((s, i) => i !== slotIdx ? s : null).filter(Boolean));
        const current = choice.slots[slotIdx];
        const dayGroups = dayOrder.map(day => {
          const daySlots = sortedSlots.filter(slot => slot.day === day);
          if (!daySlots.length) return "";
          const dayOptions = daySlots.map(slot => {
            const disabled = selectedElsewhere.has(slot.id) && slot.id !== current;
            return `<option value="${slot.id}" ${current === slot.id ? "selected" : ""} ${disabled ? "disabled" : ""}>${slot.label}${disabled ? " (Used in other subpreference)" : ""}</option>`;
          }).join("");
          return `<optgroup label="${day}">${dayOptions}</optgroup>`;
        }).join("");

        return `
          <label class="block mt-2">
            <span class="text-xs font-semibold text-emerald-800">Subpreference ${slotIdx + 1}</span>
            <select data-choice-slot="${idx}" data-slot-index="${slotIdx}" tabindex="${100 + idx * 10 + slotIdx}" class="mt-1 w-full rounded-lg border border-emerald-800/25 px-3 py-2">
              <option value="">Select time slot</option>
              ${dayGroups}
            </select>
          </label>
        `;
      }).join("");

      const activityDays = activity
        ? [...new Set(activity.slots.map(s => s.day))].sort((a, b) => dayOrder.indexOf(a) - dayOrder.indexOf(b))
        : dayOrder;
      const excludedDays = choice.excludedDays || [];
      const dayCheckboxes = activityDays.map(day => {
        const checked = excludedDays.includes(day);
        return `<label class="inline-flex items-center gap-1 cursor-pointer select-none">

          if (a.tabIndex !== b.tabIndex) return a.tabIndex - b.tabIndex;
          const pos = a.compareDocumentPosition(b);
          return (pos & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1;
        });

      const currentIdx = tabStops.indexOf(current);
      if (currentIdx === -1) return;
      const next = tabStops[currentIdx + 1] || els.saveModalBtn;

    function getValidPairMapForChoice(families, choiceIndex) {
      const map = new Map();
      const byRoom = new Map(families.map(f => [roomNorm(f.roomNumber), f]));
      families.forEach(f => {
        const pairRoom = f.form?.choices?.[choiceIndex]?.pairRoomNumber;
        const buddy = byRoom.get(roomNorm(pairRoom));
        if (!buddy || buddy.id === f.id) return;
        if (roomNorm(buddy.form?.choices?.[choiceIndex]?.pairRoomNumber) !== roomNorm(f.roomNumber)) return;
        map.set(f.id, buddy.id);
      });
      return map;
    }

    function buildPassGroups(families, pairMap, choiceKey, reverse) {
      const visited = new Set();
      const groups = [];

      families.forEach(family => {
        if (visited.has(family.id)) return;
        const buddyId = pairMap.get(family.id);
        if (buddyId) {
          const buddy = families.find(f => f.id === buddyId);
          if (buddy && pairMap.get(buddy.id) === family.id && !visited.has(buddy.id)) {
            const n1 = family.lotteryNumbers?.[choiceKey];
            const n2 = buddy.lotteryNumbers?.[choiceKey];
            const nums = [n1, n2].filter(Number.isFinite);
            const effective = nums.length ? (reverse ? Math.min(...nums) : Math.max(...nums)) : Number.MAX_SAFE_INTEGER;
            groups.push({ type: "pair", families: [family, buddy], effectiveNumber: effective });
            visited.add(family.id);
            visited.add(buddy.id);
            return;
          }
        }

        groups.push({
          type: "single",
          families: [family],
          effectiveNumber: Number.isFinite(family.lotteryNumbers?.[choiceKey]) ? family.lotteryNumbers[choiceKey] : Number.MAX_SAFE_INTEGER
        });
        visited.add(family.id);
      });

      groups.sort((a, b) => {
        if (a.effectiveNumber !== b.effectiveNumber) {
          return reverse ? b.effectiveNumber - a.effectiveNumber : a.effectiveNumber - b.effectiveNumber;
        }
        const aRoom = Math.min(...a.families.map(f => parseRoomNumber(f.roomNumber)));
        const bRoom = Math.min(...b.families.map(f => parseRoomNumber(f.roomNumber)));
        if (aRoom !== bRoom) return aRoom - bRoom;
        return a.families[0].lastName.localeCompare(b.families[0].lastName);
      });

      return groups;
    }

    function getSharedPairSlotIds(choiceA, choiceB) {
      const aSlots = choiceA?.slots?.filter(Boolean) || [];
      const bSlots = choiceB?.slots?.filter(Boolean) || [];
      const bIndex = new Map(bSlots.map((slot, idx) => [slot, idx]));

      return aSlots
        .map((slot, idx) => ({ slot, idxA: idx, idxB: bIndex.has(slot) ? bIndex.get(slot) : null }))
        .filter(row => row.idxB !== null)
        .sort((x, y) => (x.idxA + x.idxB) - (y.idxA + y.idxB))
        .map(row => row.slot);
    }

    }

    function runSerpentineLottery() {
      return runSerpentineLotteryHelper({
        state,
        getAllSlots,
        getValidPairMapForChoice,
        buildPassGroups,
        getActivityById,
        getSlotById,
        hasConflict,
        getSharedPairSlotIds,
        sortSlotsByDayAndTime,
        buildResultRow,
        parseRoomNumber
      });
    }

    function getCurrentResultRows() {
      return Array.isArray(state.results.rows) ? state.results.rows : [];
    }

    function getActiveAssignedRows() {
      return getCurrentResultRows().filter(r => ["allocated", "catchall", "manual"].includes(r.status));
    }

    function computeOpenCapacity(rows) {
      const cap = Object.fromEntries(getAllSlots().map(s => [s.id, s.capacity]));
      rows.filter(r => ["allocated", "catchall", "manual"].includes(r.status)).forEach(r => {
        if (r.slotId && cap[r.slotId] !== undefined) cap[r.slotId] -= 1;
      });
      return cap;
    }

    function validatePreRunState() {
      return validatePreRunStateHelper({
        state,
        CHOICE_KEYS,
        CHOICE_RANGES,
        dayOrder,
        getAllSlots,
        getActivities,
        roomNorm,
        findFamilyByRoom
      });
    }

    function computeDiagnostics(rows, activeRows, waitlistRows, openCap) {
      return computeDiagnosticsHelper({
        rows,
        activeRows,
        waitlistRows,
        openCap,
        state,
        getActivities
      });
    }

    async function handleDropAssignment(resultId) {
      const operator = prompt("Initials for override audit:", "Coordinator") || "Coordinator";
      const row = getCurrentResultRows().find(r => r.resultId === resultId);
      if (!row) return;

      row.status = "dropped";
      row.reason = "Manual drop";
      row.overrideBy = operator;
      row.overrideAt = new Date().toISOString();

      try {
        await cloudPost("saveResults", { results: getCurrentResultRows() });
        renderResultsTab();
      } catch (err) {
        // handled globally
      }
    }

    async function handleReassignAssignment(resultId) {
      const rows = getCurrentResultRows();
      const row = rows.find(r => r.resultId === resultId);
      if (!row) return;

      const activeRows = getActiveAssignedRows();
      const openCap = computeOpenCapacity(rows);

      const candidateSlots = getAllSlots().filter(slot => {
        if ((openCap[slot.id] || 0) <= 0 && slot.id !== row.slotId) return false;
        const familyRows = activeRows.filter(r => r.familyId === row.familyId && r.resultId !== row.resultId);
        return !familyRows.some(existing => {
          const existingSlot = getSlotById(existing.slotId);
          return existingSlot && timeKey(existingSlot) === timeKey(slot);
        });
      });

      if (!candidateSlots.length) {
        alert("No remaining open slots are available for safe reassignment.");
        return;
      }

      const menu = candidateSlots.map((slot, idx) => `${idx + 1}. ${slot.activityName} | ${slot.label}`).join("\n");
      const picked = prompt(`Choose reassignment slot number:\n${menu}`, "1");
      const idx = (parseInt(picked || "", 10) || 0) - 1;
      const slot = candidateSlots[idx];
      if (!slot) return;

      const operator = prompt("Initials for override audit:", "Coordinator") || "Coordinator";

      row.status = "manual";
      row.activityId = slot.activityId;
      row.activityName = slot.activityName;
      row.slotId = slot.id;
      row.slotLabel = slot.label;
      row.reason = "Manual reassignment";
      row.overrideBy = operator;
      row.overrideAt = new Date().toISOString();

      try {
        await cloudPost("saveResults", { results: rows });
        renderResultsTab();
      } catch (err) {
        // handled globally
      }
    }

    function escapeCsvValue(value) {
      const text = String(value ?? "");
      if (/[",\n]/.test(text)) {
        return `"${text.replace(/"/g, '""')}"`;
      }
      return text;
    }

    function downloadCsv(filename, headers, rows) {
      const lines = [headers.map(escapeCsvValue).join(",")]
        .concat(rows.map(row => row.map(escapeCsvValue).join(",")));
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function diagnosticsToSerializable(diagnostics) {
      return {
        firstChoiceEligible: diagnostics.firstChoiceEligible,
        firstChoiceWinners: diagnostics.firstChoiceWinners,
        firstChoiceRate: diagnostics.firstChoiceEligible
          ? Math.round((diagnostics.firstChoiceWinners / diagnostics.firstChoiceEligible) * 100)
          : 0,
        winBuckets: diagnostics.winBuckets,
        waitlistByActivity: Object.fromEntries(diagnostics.waitlistByActivity.entries()),
        waitlistByPass: Object.fromEntries(diagnostics.waitlistByPass.entries()),
        activitySeatStats: diagnostics.activitySeatStats,
        overrideCount: diagnostics.overrideCount,
        dropCount: diagnostics.dropCount,
        manualCount: diagnostics.manualCount
      };
    }

    function exportDiagnosticsJson(diagnostics, rows) {
      const payload = {
        exportedAt: new Date().toISOString(),
        runAt: state.results.runAt,
        diagnostics: diagnosticsToSerializable(diagnostics),
        rowCount: rows.length
      };
      downloadJson(`diagnostics-${Date.now()}.json`, payload);
    }

      const csvRows = [];

        ? Math.round((diagnostics.firstChoiceWinners / diagnostics.firstChoiceEligible) * 100)
        : 0;

      csvRows.push(["summary", "first_choice_hit_rate_pct", firstChoiceRate, ""]);
      csvRows.push(["summary", "first_choice_winners", diagnostics.firstChoiceWinners, ""]);
      csvRows.push(["summary", "first_choice_eligible", diagnostics.firstChoiceEligible, ""]);
      csvRows.push(["summary", "override_count", diagnostics.overrideCount, ""]);
      csvRows.push(["summary", "manual_count", diagnostics.manualCount, ""]);
      csvRows.push(["summary", "drop_count", diagnostics.dropCount, ""]);

      Object.entries(diagnostics.winBuckets).forEach(([bucket, count]) => {
        csvRows.push(["wins_distribution", bucket, count, ""]);
      });

      [...diagnostics.waitlistByActivity.entries()].forEach(([activity, count]) => {
        csvRows.push(["waitlist_by_activity", activity, count, ""]);
      });

      [...diagnostics.waitlistByPass.entries()].forEach(([pass, count]) => {
        csvRows.push(["waitlist_by_pass", pass, count, ""]);
      });

      diagnostics.activitySeatStats.forEach(stat => {
        csvRows.push(["activity_utilization", stat.activityName, stat.utilization, `${stat.usedSeats}/${stat.totalSeats}`]);

      downloadCsv(

    function buildPosterRows(sortMode = "room") {
      const activeRows = getActiveAssignedRows();
      const waitlistRows = getCurrentResultRows().filter(r => r.status === "waitlist");
      const sortedActive = [...activeRows].sort((a, b) => {
        const slotA = getSlotById(a.slotId);
        const slotB = getSlotById(b.slotId);
        const actDiff = (a.activityName || "").localeCompare(b.activityName || "");
        if (actDiff !== 0) return actDiff;
        const dayDiff = dayOrder.indexOf(slotA?.day || "") - dayOrder.indexOf(slotB?.day || "");
        if (dayDiff !== 0) return dayDiff;
        const timeDiff = parseTimeToMinutes(slotA?.time || "") - parseTimeToMinutes(slotB?.time || "");
        if (timeDiff !== 0) return timeDiff;
        if (sortMode === "lastName") return (a.lastName || "").localeCompare(b.lastName || "");
        return parseRoomNumber(a.roomNumber) - parseRoomNumber(b.roomNumber);
      });

      return {
        activeRows: sortedActive,
        waitlistRows
      };
    }

    function posterActivityRank(activityName) {
      const order = ["Waterskiing", "Kayaking", "Fishing", "Pontoon Cruise"];
      const index = order.indexOf(activityName);

    }

    function sortPosterActivities(activityMap) {
      return new Map([...activityMap.entries()].sort((a, b) => posterActivityRank(a[0]) - posterActivityRank(b[0]) || a[0].localeCompare(b[0])));
    }

    function resolvePosterSlotContext(row) {
      const slot = getSlotById(row.slotId);
      if (slot) return slot;

      const label = String(row.slotLabel || "").trim();
      const match = label.match(/^(Mon|Tue|Wed|Thu|Fri)\s+(\d{1,2}:\d{2}\s*(?:AM|PM))/i);
      if (match) {
        const day = match[1][0].toUpperCase() + match[1].slice(1, 3).toLowerCase();
        const time = `${match[2].toUpperCase().replace(/\s+/g, " ")}`;
        return { day, time, label };
      }

      return { day: "", time: "", label };
    }

    function randomPick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffleArray(arr) {
      const clone = [...arr];
      for (let i = clone.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [clone[i], clone[j]] = [clone[j], clone[i]];
      }
      return clone;
    }

    function assignUniqueLotteryNumbers(families) {
      if (families.length > 100) return false;
      CHOICE_KEYS.forEach(choiceKey => {
        const range = CHOICE_RANGES[choiceKey];
        const numbers = shuffleArray(Array.from({ length: range.max - range.min + 1 }, (_, index) => range.min + index));
        families.forEach((family, index) => {
          family.lotteryNumbers = family.lotteryNumbers || {};
          family.lotteryNumbers[choiceKey] = numbers[index];
        });
      });
      return true;
    }

    function generateDemoFamilies() {
      const names = ["Garcia", "Nguyen", "Patel", "Miller", "Thompson", "Wong", "Kim", "Davis", "Rodriguez", "Ali", "Singh", "Hernandez", "Baker", "Chen", "Lopez", "Scott"];
      const used = new Set();
      const families = [];

      while (families.length < 18) {
        const lastName = names[families.length % names.length];
        const roomNumber = String(100 + Math.floor(Math.random() * 99));
        if (used.has(roomNumber)) continue;
        used.add(roomNumber);

        const choices = [0, 1, 2, 3].map(() => {
          const activity = randomPick(getActivities());
          const slots = shuffleArray(activity.slots.map(s => s.id)).slice(0, 3);
          while (slots.length < 3) slots.push("");
          return {
            activityId: activity.id,
            slots,
            excludedDays: [],
            pairRoomNumber: "",
            anyAvailable: Math.random() < 0.15,
            skiingTypes: activity.id === "waterskiing"
              ? WATERSKIING_TYPE_OPTIONS.filter(() => Math.random() < 0.45).map(option => option.id)
              : []
          };
        });

        families.push({
          id: `demo-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          lastName,
          roomNumber,
          checkedInAt: new Date().toISOString(),
          expectedPartySize: 2 + Math.floor(Math.random() * 5),
          lotteryNumbers: {},
          form: {
            choices,
            anyAvailable: choices.some(choice => choice.anyAvailable)
          }
        });
      }

      assignUniqueLotteryNumbers(families);
      return families;
    }

    function buildArchiveSchedule(archive) {
      const activities = archive?.config?.activities || [];
      const activeRows = (archive?.results || []).filter(row => ["allocated", "catchall", "manual"].includes(row.status));
      return activities.slice().sort((a, b) => posterActivityRank(a.name) - posterActivityRank(b.name) || a.name.localeCompare(b.name)).map(activity => {
        const daysMarkup = dayOrder.map(day => {
          const slots = (activity.slots || []).filter(slot => slot.day === day).slice().sort((a, b) => parseTimeToMinutes(b.time) - parseTimeToMinutes(a.time));
          const slotMarkup = slots.map(slot => {
            const assigned = activeRows.filter(row => row.slotId === slot.id).sort((a, b) => (a.lastName || "").localeCompare(b.lastName || ""));
            return `<div class="border-b border-[#e6edf3] py-2 last:border-0"><div class="flex justify-between gap-2 text-xs"><span class="font-black text-[#102a43]">${escapeHtml(slot.time)}</span><span class="text-[#627d98]">${assigned.length}/${slot.capacity}</span></div><ul class="mt-1 text-xs text-[#486581]">${assigned.length ? assigned.map(row => `<li>${escapeHtml(row.lastName)} <span class="text-[#829ab1]">Rm ${escapeHtml(row.roomNumber)}</span></li>`).join("") : "<li class=\"italic text-[#9fb3c8]\">Open</li>"}</ul></div>`;
          }).join("") || `<p class="py-2 text-xs italic text-[#9fb3c8]">No scheduled slots</p>`;
          return `<section class="rounded-xl border border-[#d9e2ec] bg-[#fbfdff] p-3"><h5 class="text-xs font-black uppercase tracking-wide text-[#2774ae]">${day}</h5><div class="mt-1">${slotMarkup}</div></section>`;
        }).join("");
        return `<section class="surface-card p-4"><div class="flex items-center justify-between border-b border-[#e6edf3] pb-3"><h4 class="text-lg font-black text-[#102a43]">${escapeHtml(activity.name)}</h4><span class="text-xs font-bold text-[#627d98]">Latest time first</span></div><div class="mt-3 grid grid-cols-5 gap-2">${daysMarkup}</div></section>`;
      }).join("") || `<p class="text-sm text-[#627d98]">No schedule was stored with this archive.</p>`;

    function getArchiveLotteryFamilyIds(archive) {
      const resultRows = Array.isArray(archive?.results) ? archive.results : [];
      const idsFromResults = [...new Set(resultRows.map(row => row.familyId).filter(Boolean))];
      if (idsFromResults.length > 0) return idsFromResults;

      const families = Array.isArray(archive?.families) ? archive.families : [];

        .map(family => family.id)
        .filter(Boolean);
      if (idsFromLotteryNumbers.length > 0) return idsFromLotteryNumbers;

      return families.map(family => family.id).filter(Boolean);
    }

    function getArchiveLotteryFamilyCount(archive) {
      const ids = getArchiveLotteryFamilyIds(archive);
      if (ids.length > 0) return ids.length;
      const families = Array.isArray(archive?.families) ? archive.families : [];
      return Math.max(0, Number(archive?.familyCount) || families.length || 0);
    }

    function summarizeWinBucketsFromCounts(winCounts) {
      const buckets = { "0": 0, "1": 0, "2": 0, "3+": 0 };
      winCounts.forEach(count => {
        if (count <= 0) buckets["0"] += 1;
        else if (count === 1) buckets["1"] += 1;
        else if (count === 2) buckets["2"] += 1;
        else buckets["3+"] += 1;
      });
      return buckets;
    }

    function getArchiveWinBuckets(archive) {
      const participantIds = getArchiveLotteryFamilyIds(archive);
      const activeRows = getArchiveActiveRows(archive);
      const winsByFamily = new Map(participantIds.map(id => [id, 0]));
      activeRows.forEach(row => winsByFamily.set(row.familyId, (winsByFamily.get(row.familyId) || 0) + 1));
      return summarizeWinBucketsFromCounts([...winsByFamily.values()]);
    }

    function getObservedMaxWins(archive) {
      const participantIds = getArchiveLotteryFamilyIds(archive);
      const activeRows = getArchiveActiveRows(archive);
      if (!participantIds.length || !activeRows.length) return 1;
      const winsByFamily = new Map(participantIds.map(id => [id, 0]));
      activeRows.forEach(row => winsByFamily.set(row.familyId, (winsByFamily.get(row.familyId) || 0) + 1));
      return Math.max(1, ...winsByFamily.values());
    }

    function getArchiveConfiguredWinCap(archive) {
      const configured = Number(archive?.config?.maxWinsPerFamily);
      if (Number.isFinite(configured) && configured >= 1) return configured;
      return 1;
    }

    function getArchiveMethodEffectiveWinCap(archive) {
      const configuredCap = getArchiveConfiguredWinCap(archive);
      // Mirror current lottery behavior where catch-all allocation can extend
      // families up to 4 total wins even when configured cap is lower.
      return Math.max(configuredCap, 4);
    }

    function shuffleIndices(length) {
      const arr = Array.from({ length }, (_, index) => index);
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function simulateLinearWinBuckets(familyCount, assignmentCount, maxWins, trialCount = 4000) {
      const n = Math.max(0, Number(familyCount) || 0);
      const assignments = Math.max(0, Number(assignmentCount) || 0);
      const cap = Math.max(1, Number(maxWins) || 1);
      if (!n) return { "0": 0, "1": 0, "2": 0, "3+": 0 };

      const totals = { "0": 0, "1": 0, "2": 0, "3+": 0 };
      for (let trial = 0; trial < trialCount; trial += 1) {
        const order = shuffleIndices(n);
        const wins = Array(n).fill(0);
        let seatsRemaining = assignments;
        let cursor = 0;
        let assignedInCycle = 0;

        while (seatsRemaining > 0) {
          const familyIndex = order[cursor];
          if (wins[familyIndex] < cap) {
            wins[familyIndex] += 1;
            seatsRemaining -= 1;
            assignedInCycle += 1;
          }

          cursor += 1;
          if (cursor >= n) {
            cursor = 0;
            if (assignedInCycle === 0) break;
            assignedInCycle = 0;
          }
        }

        const trialBuckets = summarizeWinBucketsFromCounts(wins);
        totals["0"] += trialBuckets["0"];
        totals["1"] += trialBuckets["1"];
        totals["2"] += trialBuckets["2"];
        totals["3+"] += trialBuckets["3+"];
      }

      return {
        "0": Math.round((totals["0"] / trialCount) * 10) / 10,
        "1": Math.round((totals["1"] / trialCount) * 10) / 10,
        "2": Math.round((totals["2"] / trialCount) * 10) / 10,
        "3+": Math.round((totals["3+"] / trialCount) * 10) / 10
      };
    }

    function buildFishBowlTicketPool(familyCount, entriesPerFamily = 3.5) {
      const n = Math.max(0, Number(familyCount) || 0);
      const baseEntries = Math.floor(entriesPerFamily);
      const fractional = Math.max(0, entriesPerFamily - baseEntries);
      const extrasTarget = Math.round(n * fractional);
      const shuffled = shuffleIndices(n);

      const tickets = [];
      for (let familyIndex = 0; familyIndex < n; familyIndex += 1) {
        for (let entry = 0; entry < baseEntries; entry += 1) tickets.push(familyIndex);
      }
      for (let i = 0; i < extrasTarget && i < shuffled.length; i += 1) tickets.push(shuffled[i]);
      return tickets;
    }

    function simulateFishBowlWinBuckets(familyCount, assignmentCount, maxWins, trialCount = 2500, entriesPerFamily = 3.5) {
      const n = Math.max(0, Number(familyCount) || 0);
      const assignments = Math.max(0, Number(assignmentCount) || 0);
      const cap = Math.max(1, Number(maxWins) || 1);
      if (!n) return { "0": 0, "1": 0, "2": 0, "3+": 0 };

      const totals = { "0": 0, "1": 0, "2": 0, "3+": 0 };
      for (let trial = 0; trial < trialCount; trial += 1) {
        const wins = Array(n).fill(0);
        const tickets = buildFishBowlTicketPool(n, entriesPerFamily);
        let seatsRemaining = assignments;

        while (seatsRemaining > 0 && tickets.length > 0) {
          const pickIndex = Math.floor(Math.random() * tickets.length);
          const familyIndex = tickets[pickIndex];
          tickets[pickIndex] = tickets[tickets.length - 1];
          tickets.pop();
          if (wins[familyIndex] >= cap) continue;
          wins[familyIndex] += 1;
          seatsRemaining -= 1;
        }

        const trialBuckets = summarizeWinBucketsFromCounts(wins);
        totals["0"] += trialBuckets["0"];
        totals["1"] += trialBuckets["1"];
        totals["2"] += trialBuckets["2"];
        totals["3+"] += trialBuckets["3+"];
      }

      return {
        "0": Math.round((totals["0"] / trialCount) * 10) / 10,
        "1": Math.round((totals["1"] / trialCount) * 10) / 10,
        "2": Math.round((totals["2"] / trialCount) * 10) / 10,
        "3+": Math.round((totals["3+"] / trialCount) * 10) / 10
      };
    }

    function runLinearReplayWinBuckets(archive) {
      const families = structuredClone(Array.isArray(archive?.families) ? archive.families : []);
      const activities = Array.isArray(archive?.config?.activities) ? archive.config.activities : [];
      const participantIds = getArchiveLotteryFamilyIds(archive);
      if (!families.length || !activities.length || !participantIds.length) return { "0": 0, "1": 0, "2": 0, "3+": 0 };

      const allSlots = activities.flatMap(activity => (activity.slots || []).map(slot => ({ ...slot, activityId: activity.id, activityName: activity.name })));
      const activityById = new Map(activities.map(activity => [activity.id, activity]));
      const slotById = new Map(allSlots.map(slot => [slot.id, slot]));
      const replayState = { families, config: { maxWinsPerFamily: getArchiveConfiguredWinCap(archive) } };

      const replay = runSerpentineLotteryHelper({
        state: replayState,
        getAllSlots: () => allSlots,
        getValidPairMapForChoice,
        buildPassGroups,
        getActivityById: activityId => activityById.get(activityId),
        getSlotById: slotId => slotById.get(slotId),
        hasConflict,
        getSharedPairSlotIds,
        sortSlotsByDayAndTime,
        buildResultRow,
        parseRoomNumber,
        forceLinearOrder: true
      });

      const winsByFamily = new Map(participantIds.map(id => [id, 0]));
      replay.rows.filter(row => ["allocated", "catchall", "manual"].includes(row.status)).forEach(row => {
        winsByFamily.set(row.familyId, (winsByFamily.get(row.familyId) || 0) + 1);
      });

      return summarizeWinBucketsFromCounts([...winsByFamily.values()]);
    }

    function buildFairnessHistogram(archive, trialCount = 2500) {
      const familyCount = getArchiveLotteryFamilyCount(archive);
      const assignmentCount = getArchiveActiveRows(archive).length || Math.max(0, Number(archive?.assignmentCount) || 0);
      const observedMaxWins = getObservedMaxWins(archive);
      const configuredWinCap = getArchiveConfiguredWinCap(archive);
      const effectiveWinCap = getArchiveMethodEffectiveWinCap(archive);
      const actualBuckets = getArchiveWinBuckets(archive);
      const linearBuckets = runLinearReplayWinBuckets(archive);
      const fishBowlBuckets = simulateFishBowlWinBuckets(familyCount, assignmentCount, effectiveWinCap, trialCount, 3.5);
      const bucketOrder = ["0", "1", "2", "3+"];

      const rows = bucketOrder.map(bucket => {
        const actualCount = Number(actualBuckets[bucket] || 0);
        const linearCount = Number(linearBuckets[bucket] || 0);
        const fishBowlCount = Number(fishBowlBuckets[bucket] || 0);
        const actualPct = familyCount ? (actualCount / familyCount) * 100 : 0;
        const linearPct = familyCount ? (linearCount / familyCount) * 100 : 0;
        const fishBowlPct = familyCount ? (fishBowlCount / familyCount) * 100 : 0;
        return {
          bucket,
          actualCount,
          actualPct,
          linearCount,
          linearPct,
          fishBowlCount,
          fishBowlPct
        };
      });

      return {
        familyCount,
        assignmentCount,
        configuredWinCap,
        effectiveWinCap,
        observedMaxWins,
        fishBowlEntriesPerFamily: 3.5,
        trialCount,
        rows
      };
    }

    function buildArchiveFairnessPanel(archive, options = {}) {
      const forPrint = Boolean(options.forPrint);
      const trialCount = 2500;
      const fairness = buildFairnessHistogram(archive, trialCount);
      const metricsMarkup = forPrint

      return `<section class="${forPrint ? "fairness-panel fairness-page" : "surface-card p-5 fairness-panel"}"><h3 class="text-lg font-black">Fairness comparison</h3><p class="fairness-note">Serpentine vs baselines under matched constraints: ${fairness.familyCount} lottery participants, ${fairness.assignmentCount} assignments, configured cap ${fairness.configuredWinCap} and method-effective cap ${fairness.effectiveWinCap} wins/family (observed max ${fairness.observedMaxWins}). Fish-bowl baseline uses N×${fairness.fishBowlEntriesPerFamily.toFixed(1)} entries.</p>${metricsMarkup}<div class="histogram-shell"><div class="histogram-legend"><span class="legend-item"><span class="legend-chip actual"></span>Published serpentine</span><span class="legend-item"><span class="legend-chip linear"></span>Linear replay (same lottery numbers)</span><span class="legend-item"><span class="legend-chip fishbowl"></span>Fish-bowl baseline (${fairness.trialCount.toLocaleString()} trials)</span></div>${rowMarkup}</div></section>`;
    }

        els.tourTitle.textContent = step.title;
        els.tourMessage.textContent = step.message;
        els.tourNextBtn.textContent = index === TOUR_STEPS.length - 1 ? "Finish tutorial" : "Next";
        els.tourPopover.style.top = `${Math.min(window.innerHeight - 230, Math.max(16, rect.bottom + 16))}px`;
        els.tourPopover.style.left = `${Math.min(window.innerWidth - 380, Math.max(16, rect.left))}px`;
        els.tourOverlay.classList.remove("hidden");
      }, 80);
    }
    function startTutorial() { els.tourOverlay.classList.remove("hidden"); showTourStep(0); }
    els.tourSkipBtn.addEventListener("click", stopTutorial);
    els.tourNextBtn.addEventListener("click", () => showTourStep(activeTourStep + 1));

    function renderConfigTab() {
      return renderConfigTabModule({ renderConfigTabImpl });
    }

    function renderHomeTab() {
      return renderHomeTabImpl();
    }

    function renderHistoryTab() {
      return renderHistoryTabImpl();
    }

    function renderEntryTab() {
      return renderEntryTabModule({ renderEntryTabImpl });
    }

    function renderResultsTab() {
      return renderResultsTabModule({ renderResultsTabImpl });
    }

    function renderPosterTab() {
      return renderPosterTabModule({ renderPosterTabImpl });
    }

    function renderFormsTab() {
      return renderFormsTabImpl();
    }

    function renderWikiTab() {
      return renderWikiTabModule({ renderWikiTabImpl });
    }

    async function resetApp() {
      requestConfirmation({
        title: "Reset all lottery data?",
        message: "This clears the active workspace and all published archives. Export a backup first if you may need these records later.",
        confirmLabel: "Reset all data",
        onConfirm: async () => {
          const resetDefaults = getStoredDefaultConfig();
          state = defaultState();
          assignConfigToState(resetDefaults, resetDefaults);
          try { await cloudPost("resetAll", { config: buildPersistedConfig() }); render(); setActiveTab("home"); } catch (err) { /* handled globally */ }
        }
      });
    }

    function downloadJson(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportBackup() {
      const backup = buildBackupPayload();
      downloadJson(`summer-camp-backup-${Date.now()}.json`, backup);
    }

    function importBackupPrompt() {
      els.backupFileInput.value = "";
      els.backupFileInput.click();
    }

    async function syncLocalChangesToCloud() {
      if (!hasPendingLocalChanges) {
        alert("There are no pending local-only changes to sync.");
        return;
      }

      if (!confirm("Push this browser's local snapshot to the cloud and replace the current cloud copy?")) return;

      const backup = buildBackupPayload();

      try {
        const response = await cloudPost("restoreBackup", { backup });
        if (response.localOnly) {
          render();
          return;
        }

        isOfflineMode = false;
        saveStateSnapshotLocally({ dirty: false, lastCloudSyncAt: response.serverTime || lastCloudSyncAt });
        hideBanner();
        render();
        setSyncing(false);
        alert("Local changes synced to cloud.");
      } catch (err) {
        showBanner(`Cloud sync failed: ${err.message}`);
      }
    }

    async function discardLocalUnsyncedChanges() {
      if (!hasPendingLocalChanges) {
        alert("There are no pending local-only changes to discard.");
        return;
      }

      if (!confirm("Discard this browser's unsynced local changes and reload from cloud?")) return;

      saveStateSnapshotLocally({ dirty: false });
      hideBanner();

      try {
        await syncFromCloud();
        render();
        alert("Local unsynced changes discarded. Reloaded latest cloud data.");
      } catch (err) {
        showBanner(`Unable to reload from cloud after discard: ${err.message}`);
      }
    }

    async function handleBackupFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const backup = JSON.parse(text);
        if (!Array.isArray(backup.families) || !backup.config || !Array.isArray(backup.results)) {
          alert("Backup file is invalid.");
          return;
        }
        requestConfirmation({
          title: "Replace data with this backup?",
          message: "The imported backup will replace the active workspace and published history currently stored in this browser.",
          confirmLabel: "Import and replace",
          onConfirm: async () => {
            applyStateSnapshot(backup);
            saveStateSnapshotLocally({ dirty: false });
            const response = await cloudPost("restoreBackup", { backup });
            if (!response.localOnly) saveStateSnapshotLocally({ dirty: false, lastCloudSyncAt: response.serverTime || lastCloudSyncAt });
            render();
            setActiveTab("home");
          }
        });
      } catch (err) {
        showBanner(`Import failed: ${err.message}`);
      }
    }

    async function syncFromCloud() {
      const snapshot = loadLocalSnapshot();
      if (snapshot) applyStateSnapshot(snapshot);
    }

    syncClient = createSyncClient({
      githubOwner: GITHUB_OWNER,
      githubRepo: GITHUB_REPO,
      githubBranch: GITHUB_BRANCH,
      githubDatabasePath: GITHUB_DATABASE_PATH,
      githubTokenStorageKey: GITHUB_TOKEN_STORAGE_KEY,
      githubShaStorageKey: GITHUB_SHA_STORAGE_KEY,
      setSyncing,
      hideBanner,
      showBanner,
      setSpreadsheetUrl,
      getSpreadsheetUrl: () => spreadsheetUrl,
      createCloudError,
      getMisconfiguredEndpointMessage,
      isRecoverableCloudError,
      getFriendlyCloudErrorMessage,
      saveStateSnapshotLocally,
      getLastCloudSyncAt: () => lastCloudSyncAt,
      setLastCloudSyncAt: (value) => { lastCloudSyncAt = value || null; },
      setHasPendingLocalChanges: (value) => { hasPendingLocalChanges = Boolean(value); },
      setIsOfflineMode: (value) => { isOfflineMode = Boolean(value); },
      loadLocalSnapshot,
      getSnapshotMeta,
      applyStateSnapshot,
      getDatabaseSnapshot: () => ({
        families: state.families,
        config: buildPersistedConfig(),
          results: getCurrentResultRows(),
          archives: state.archives || []
      }),
      render
    });

    function render() {
      switchView();
      updateSyncLocalButtonState();
      renderHomeTab();
      renderHistoryTab();
      renderConfigTab();
      renderEntryTab();
      renderResultsTab();
      renderPosterTab();
      renderFormsTab();
      renderWikiTab();
    }

    bootstrapApp({
      els,
      setSidebarCollapsed,
      switchView,
      setActiveTab,
      closeEntryModal,
      saveEntryModal,
      handleModalEnterNavigation,
      closeEditFamilyModal,
      saveEditFamilyModal,
      loadDemoGuests,
      getSpreadsheetUrl: () => spreadsheetUrl,
      syncLocalChangesToCloud,
      discardLocalUnsyncedChanges,
      resetApp,
      exportBackup,
      importBackupPrompt,
      handleBackupFile,
      updateSidebarLayout: () => {},  // sidebar layout managed internally
      setSpreadsheetUrl,
      DEFAULT_SPREADSHEET_URL,
      syncFromCloud,
      isOfflineMode: () => isOfflineMode,
      hasPendingLocalChanges: () => hasPendingLocalChanges,
      hideBanner,
      render,
      loadSidebarPreference,
      getIsSidebarCollapsed: () => isSidebarCollapsed
    });
  </script>
</body>
</html>
